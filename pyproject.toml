[project]
name = "pyside-markdown-editor"
version = "0.1.0"
description = "Markdown editor with live preview: PySide6 + Qt WebEngine, from the Qt for Python markdowneditor example"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = [
    "PySide6>=6.8",
]

[project.scripts]
markdown-editor = "markdowneditor.__main__:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "markdowneditor"
